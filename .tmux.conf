unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s
set-option -g status-position top

set-window-option -g mode-keys vi
set -g default-terminal "screen-256color"
set-option -g history-limit 3000
unbind -T copy-mode-vi Space; #Default for begin-selection
unbind -T copy-mode-vi Enter; #Default for copy-selection

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xsel --clipboard"

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'rose-pine/tmux'

# rose-pine theme options (must be set BEFORE tpm runs -- the plugin reads
# them and then overwrites status-left/status-right itself)
set -g @rose_pine_variant 'main' # Options are 'main', 'moon' or 'dawn'

# Left: session name + current window (shown by default).
# Show the running program in the window list instead of the bare name.
set -g @rose_pine_show_current_program 'on'

# Right: battery, then date/time. Prints nothing on machines with no battery.
set -g @rose_pine_status_right_prepend_section '#(b=`echo /sys/class/power_supply/BAT*`; [ -r "$b/capacity" ] || exit 0; read c < "$b/capacity"; read s < "$b/status"; i=󰁹; [ "$s" = Charging ] && i=󰂄; [ "$c" -le 20 ] && [ "$s" != Charging ] && i=󰂃; echo "$i $c%%")'
set -g @rose_pine_date_time '%Y-%m-%d %H:%M'

run '~/.tmux/plugins/tpm/tpm'
